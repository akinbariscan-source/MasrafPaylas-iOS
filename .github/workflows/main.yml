# iPhone kurulum dosyası (.ipa) üretir.
name: iOS IPA oluştur

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini oluştur
        run: |
          mkdir -p Sources
          cp MasrafPaylas.swiftpm/*.swift Sources/
          rm Sources/Package.swift
          xcodegen generate

      - name: Derle (imzasız)
        run: |
          xcodebuild \
            -project MasrafPaylas.xcodeproj \
            -target MasrafPaylas \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MasrafPaylas.app Payload/
          zip -qry MasrafPaylas.ipa Payload
          ls -lh MasrafPaylas.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MasrafPaylas-ipa
          path: MasrafPaylas.ipa
